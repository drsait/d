name: Android APK Builder
on:
  push:
    paths:
      - 'android-project.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q android-project.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ZIP içinde Android Gradle projesi bulunamadı"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
