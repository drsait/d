
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sayfa Bulunamadı</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font: bold 28px Arial;
  text-align: center;
}
</style>
</head>
<body>
<div>Sayfa bulunamadı.</div>
<div id="sayac"></div>

<script>
let sayi = Number(sessionStorage.getItem("yenilemeSayisi") || 0);
document.getElementById("sayac").textContent = sayi + ". deneme";

setTimeout(() => {
  sessionStorage.setItem("yenilemeSayisi", sayi + 1);
  location.reload();
}, 1000);
</script>
</body>
</html>
