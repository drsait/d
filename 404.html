<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deneme yapılıyor</title>
<style>
body {
  margin: 0;
  height: 100vh;
  background: #111111;
  color: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font: bold 28px Arial;
  text-align: center;
}
#sayac {
  margin-top: 12px;
  color: #aaaaaa;
  font-size: 22px;
}
</style>
</head>
<body>
<div>Sayfa bulunamadı.</div>
<div id="sayac"></div>

<script>
let sayi = Number(sessionStorage.getItem("yenilemeSayisi") || 0) + 1;
sessionStorage.setItem("yenilemeSayisi", sayi);

document.title = sayi + ". deneme yapılıyor";
document.getElementById("sayac").textContent = sayi + ". deneme yapılıyor";

setTimeout(() => {
  location.reload();
}, 1000);
</script>
</body>
</html>
