<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Yılan Arenası</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080f29;font:14px system-ui,Arial;color:white;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:crosshair}#hud{position:absolute;top:16px;left:18px;pointer-events:none;text-shadow:0 1px 5px #000}#hud strong{color:#ffe94a;font-size:21px}#board{position:absolute;top:13px;right:16px;padding:12px 16px;background:#08122ac7;border:1px solid #5b7aa977;border-radius:13px;min-width:178px;line-height:1.8;pointer-events:none}#board b{color:#ffe65b}#board .you{color:#ffe65b}#board small{color:#94add3}#help{position:absolute;bottom:14px;left:18px;color:#b9d1ff;text-shadow:0 1px 3px #000;pointer-events:none}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050b20ba;backdrop-filter:blur(4px)}#panel{text-align:center;background:#0c1733f2;border:1px solid #607eb299;box-shadow:0 18px 65px #000a;border-radius:24px;padding:30px 36px;max-width:calc(100% - 30px);width:390px}h1{margin:0 0 8px;font-size:30px;color:#ffe854}p{color:#c5d8fa;line-height:1.55}input{width:100%;padding:13px;border-radius:11px;border:1px solid #7187b5;background:#07132e;color:white;text-align:center;font:inherit;margin:12px 0}button{border:0;border-radius:11px;background:#ffdf44;color:#141622;font-weight:800;padding:13px 30px;cursor:pointer;font-size:16px}button:hover{background:#fff18c}#mobileBoost{display:none;position:absolute;bottom:25px;right:24px;border:2px solid #ffeb95;background:#c89830a9;color:white;border-radius:50%;width:80px;height:80px;padding:0;touch-action:none;user-select:none} @media(pointer:coarse){#mobileBoost{display:block}#help{max-width:55%;font-size:12px}#board{font-size:12px;min-width:137px;padding:7px 10px}}
</style></head><body><canvas id="game"></canvas><div id="hud">Puan: <strong id="score">0</strong><div id="length"></div></div><div id="board"><b>🏆 Sıralama</b><div id="ranking"></div></div><div id="help">Fare / parmak: yönlendir • Sol tık / Boşluk: hızlan • P: duraklat</div><button id="mobileBoost">HIZ</button><div id="menu"><div id="panel"><h1>🐍 Neon Yılan Arenası</h1><p id="description">Işıklı yemleri topla, uzayıp büyü!<br>Diğer yılanların gövdelerine çarpma.<br>Hızlanırken biraz uzunluk kaybedersin.</p><input id="nickname" maxlength="16" value="Oyuncu" aria-label="Oyuncu adı"><button id="play">OYUNA BAŞLA</button></div></div><script>
(()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),scoreEl=document.querySelector('#score'),lenEl=document.querySelector('#length'),ranking=document.querySelector('#ranking'),menu=document.querySelector('#menu'),desc=document.querySelector('#description'),play=document.querySelector('#play'),nick=document.querySelector('#nickname'),boostBtn=document.querySelector('#mobileBoost');let W,H,dpr,playing=false,paused=false,player,bots=[],foods=[],particles=[],camera={x:0,y:0},mouse={x:0,y:0},press=false,touchBoost=false,keys={},last=0,time=0,score=0,bgFoodWords=[];const WORLD=4400,FOOD_GOAL=540,STEP=10;const colors=['#52edff','#67ffff','#ffe869','#ffb7dc','#9e96ff','#7bffc7','#ffffff','#ffb36b'];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist2=(x,y,x2,y2)=>(x-x2)**2+(y-y2)**2;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);mouse.x=W*.75;mouse.y=H*.5}addEventListener('resize',resize);resize();const names=['Luna','Pixel','Turbo','Mavi','Meteor','Neon','Zıpzıp','Yıldız','Sarı','Nova','Kobra','Efsane','Işık','Roket','Şimşek','Gölge'];function food(x=rand(70,WORLD-70),y=rand(70,WORLD-70),value=rand(1,4)){return{x,y,r:rand(3.5,8),c:colors[Math.floor(rand(0,colors.length))],value,phase:rand(0,7)}}function makeSnake(x,y,color,name,bot=false,segments=42){let a=rand(-Math.PI,Math.PI);return{x,y,a,color,name,bot,points:Array.from({length:segments},(_,i)=>({x:x-Math.cos(a)*i*STEP,y:y-Math.sin(a)*i*STEP})),length:segments,travel:0,target:rand(-Math.PI,Math.PI),think:0,speed:2.3,alive:true,boost:false,score:0,respawn:0}}function spawnBot(){let x=rand(200,WORLD-200),y=rand(200,WORLD-200),c=colors[Math.floor(rand(0,colors.length))];let b=makeSnake(x,y,c,names[Math.floor(rand(0,names.length))]+Math.floor(rand(1,999)),true,Math.floor(rand(25,105)));bots.push(b)}function setup(){score=0;time=0;foods=Array.from({length:FOOD_GOAL},()=>food());bots=[];for(let i=0;i<11;i++)spawnBot();player=makeSnake(WORLD/2,WORLD/2,'#ffe74f',nick.value.trim()||'Oyuncu',false,51);camera.x=player.x-W/2;camera.y=player.y-H/2;scoreEl.textContent='0';menu.style.display='none';playing=true;paused=false;last=performance.now()}play.onclick=setup;addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){press=true}else{mouse.x=e.clientX;mouse.y=e.clientY;press=true}});addEventListener('pointerup',()=>press=false);boostBtn.addEventListener('pointerdown',e=>{e.stopPropagation();touchBoost=true});for(let ev of ['pointerup','pointercancel','pointerleave'])boostBtn.addEventListener(ev,()=>touchBoost=false);addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&playing){paused=!paused;desc.innerHTML=paused?'Oyun duraklatıldı. Devam etmek için P tuşuna bas.':'';menu.style.display=paused?'flex':'none';play.style.display=paused?'none':'inline-block'}});addEventListener('keyup',e=>keys[e.code]=false);function angleDiff(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}function moveSnake(s,dt){let speed=2.25;if(s.bot){s.think-=dt;if(s.think<=0){s.think=rand(15,55);let fx=0,fy=0,dd=1e8;for(let i=0;i<foods.length;i+=3){let f=foods[i],d=dist2(s.x,s.y,f.x,f.y);if(d<dd){dd=d;fx=f.x;fy=f.y}}s.target=Math.atan2(fy-s.y,fx-s.x)+rand(-.55,.55);if(s.x<240||s.x>WORLD-240||s.y<240||s.y>WORLD-240)s.target=Math.atan2(WORLD/2-s.y,WORLD/2-s.x)} }else{s.target=Math.atan2(mouse.y-H/2,mouse.x-W/2);s.boost=press||touchBoost||keys.Space||keys.ShiftLeft;if(keys.ArrowUp)s.target=-Math.PI/2;if(keys.ArrowDown)s.target=Math.PI/2;if(keys.ArrowLeft)s.target=Math.PI;if(keys.ArrowRight)s.target=0}let boosted=s.bot?(Math.random()<.002&&s.length>35):s.boost;speed=boosted&&s.length>25?3.8:2.25;s.a+=clamp(angleDiff(s.a,s.target),-.069*dt,.069*dt);let oldX=s.x,oldY=s.y;s.x=clamp(s.x+Math.cos(s.a)*speed*dt,18,WORLD-18);s.y=clamp(s.y+Math.sin(s.a)*speed*dt,18,WORLD-18);s.travel+=Math.hypot(s.x-oldX,s.y-oldY);while(s.travel>=STEP){s.points.unshift({x:s.x,y:s.y});s.travel-=STEP;while(s.points.length>s.length)s.points.pop()}if(boosted&&s.length>25&&Math.random()<.045*dt){s.length--;foods.push(food(s.points[s.points.length-1].x+rand(-12,12),s.points[s.points.length-1].y+rand(-12,12),1))}for(let i=foods.length-1;i>=0;i--){let f=foods[i];if(dist2(s.x,s.y,f.x,f.y)<(f.r+14)**2){s.length+=Math.max(1,Math.round(f.value));s.score+=Math.ceil(f.value*10);if(s===player){score=s.score;scoreEl.textContent=score}foods[i]=food();if(Math.random()<.3)particles.push({x:f.x,y:f.y,life:20,c:f.c})}}}
function crash(s,others){for(let b of others){if(b===s)continue;for(let i=5;i<b.points.length;i+=2){let p=b.points[i];if(dist2(s.x,s.y,p.x,p.y)<(s.bot?260:245))return true}}return false}function kill(s){for(let i=0;i<s.points.length;i+=2){let p=s.points[i];foods.push(food(clamp(p.x+rand(-9,9),20,WORLD-20),clamp(p.y+rand(-9,9),20,WORLD-20),rand(2,6)))}if(s===player){playing=false;menu.style.display='flex';play.style.display='inline-block';desc.innerHTML=`Oyun bitti! <b style="color:#ffe74f">${score} puan</b> topladın.<br>Yeniden denemek için başlat.`;play.textContent='YENİDEN OYNA'}else{bots.splice(bots.indexOf(s),1);spawnBot()}while(foods.length>FOOD_GOAL+250)foods.shift()}
function update(dt){time+=dt;let all=[player,...bots];for(let s of all)moveSnake(s,dt);for(let s of [...all])if(crash(s,all))kill(s);camera.x+=(player.x-W/2-camera.x)*.15;camera.y+=(player.y-H/2-camera.y)*.15;for(let i=particles.length-1;i>=0;i--){particles[i].life-=dt;if(particles[i].life<=0)particles.splice(i,1)}lenEl.textContent=`Uzunluk: ${player.length}`;if(Math.floor(time)%30===0&&Math.random()<.06){let ranks=[player,...bots].sort((a,b)=>b.score+b.length*3-a.score-a.length*3);ranking.innerHTML=ranks.slice(0,8).map((s,i)=>`<div class="${s===player?'you':''}">${i+1}. ${escapeHTML(s.name)} <small>${s.score+s.length*3|0}</small></div>`).join('')}}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function createFoodTextDots(text,x,y,size=170,gap=15){const off=document.createElement('canvas');off.width=Math.max(1600,Math.ceil(text.length*size*.72));off.height=Math.ceil(size*1.6);const octx=off.getContext('2d');octx.clearRect(0,0,off.width,off.height);octx.fillStyle='#fff';octx.textAlign='center';octx.textBaseline='middle';octx.font=`900 ${size}px Arial Black, Arial, sans-serif`;octx.fillText(text,off.width/2,off.height/2);const img=octx.getImageData(0,0,off.width,off.height).data;let dots=[];for(let py=0;py<off.height;py+=gap){for(let px=0;px<off.width;px+=gap){if(img[(py*off.width+px)*4+3]>100){dots.push({x:x+px-off.width/2,y:y+py-off.height/2,r:rand(4.3,7.3),c:colors[Math.floor(rand(0,colors.length))],phase:rand(0,7)})}}}return dots}
function createBackgroundWords(){bgFoodWords=[...createFoodTextDots('ZEYNEP KURT',WORLD*.5,WORLD*.25,200,16),...createFoodTextDots('RENGIN KURT',WORLD*.5,WORLD*.74,200,16)]}
createBackgroundWords();
function drawDecorFood(f,alpha=1){let x=f.x-camera.x,y=f.y-camera.y;if(x<-30||y<-30||x>W+30||y>H+30)return;let r=f.r*(1+.14*Math.sin(time*.05+f.phase));ctx.globalAlpha=alpha;ctx.shadowBlur=13;ctx.shadowColor=f.c;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff90';ctx.beginPath();ctx.arc(x-r*.28,y-r*.3,r*.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function background(){ctx.fillStyle='#070e27';ctx.fillRect(0,0,W,H);const spacing=12,offx=(((-camera.x*.58)%spacing)+spacing)%spacing,offy=(((-camera.y*.58)%spacing)+spacing)%spacing;ctx.fillStyle='#1c315c';for(let y=offy-12;y<H+12;y+=spacing){let row=Math.round((y-offy)/spacing);for(let x=offx-12+(row%2)*6;x<W+12;x+=spacing){ctx.beginPath();ctx.arc(x,y,3.1,0,Math.PI*2);ctx.fill()}}let grid=190;ctx.strokeStyle='#6b9cd8b0';ctx.lineWidth=1.8;ctx.setLineDash([1,7]);ctx.lineCap='round';for(let x=-((camera.x%grid)+grid)%grid-grid;x<W+grid;x+=grid){ctx.beginPath();for(let y=-grid;y<H+grid;y+=grid){let shift=(Math.floor((y+camera.y)/grid)%2)*grid/2;ctx.moveTo(x+shift,y);ctx.lineTo(x+shift+grid*.45,y+grid*.52);ctx.lineTo(x+shift,y+grid)}ctx.stroke()}ctx.setLineDash([]);for(let f of bgFoodWords)drawDecorFood(f,.95)}function drawFood(f){let x=f.x-camera.x,y=f.y-camera.y;if(x<-25||y<-25||x>W+25||y>H+25)return;let r=f.r*(1+.09*Math.sin(time*.07+f.phase));ctx.shadowBlur=12;ctx.shadowColor=f.c;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffff80';ctx.beginPath();ctx.arc(x-r*.28,y-r*.3,r*.3,0,Math.PI*2);ctx.fill()}function drawSnake(s){let p=s.points;if(!p.length)return;let headX=s.x-camera.x,headY=s.y-camera.y;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#030817';ctx.lineWidth=38;ctx.beginPath();ctx.moveTo(headX,headY);for(let i=0;i<p.length;i++)ctx.lineTo(p[i].x-camera.x,p[i].y-camera.y);ctx.stroke();ctx.strokeStyle=s.color;ctx.shadowBlur=9;ctx.shadowColor=s.color;ctx.lineWidth=29;ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#111b3a';ctx.lineWidth=20;ctx.stroke();for(let i=0;i<p.length;i+=1){let z=p[i],x=z.x-camera.x,y=z.y-camera.y;if(x<-30||x>W+30||y<-30||y>H+30)continue;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x,y,6.5,0,Math.PI*2);ctx.fill()}ctx.save();ctx.translate(headX,headY);ctx.rotate(s.a);ctx.fillStyle=s.color;ctx.strokeStyle='#071022';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,19,17,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(7,-7,5,0,Math.PI*2);ctx.arc(7,7,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0c1436';ctx.beginPath();ctx.arc(9,-7,2.5,0,Math.PI*2);ctx.arc(9,7,2.5,0,Math.PI*2);ctx.fill();ctx.restore();if(s.bot){ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(s.name,headX,headY-27)}}function render(){background();for(let f of foods)drawFood(f);for(let s of bots)drawSnake(s);if(player)drawSnake(player);for(let p of particles){ctx.globalAlpha=p.life/20;ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x-camera.x,p.y-camera.y,22-p.life,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;if(paused){ctx.fillStyle='#0008';ctx.fillRect(0,0,W,H)}}function loop(now){let dt=Math.min((now-last)/16.6667||1,2);last=now;if(playing&&!paused)update(dt);render();requestAnimationFrame(loop)}player=makeSnake(WORLD/2,WORLD/2,'#ffe74f','Oyuncu');foods=Array.from({length:250},()=>food());camera.x=player.x-W/2;camera.y=player.y-H/2;requestAnimationFrame(loop)})();
</script></body></html>
