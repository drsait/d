<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Piyasa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
    .box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px #0004; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h3 { font-size: 1rem; color: #38bdf8; }
    button { background: #334155; color: #fff; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
    button:active { transform: scale(0.95); }
    .row { display: flex; justify-content: space-between; background: #0f172a80; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; }
    .val { font-weight: 700; color: #38bdf8; }
    .time { font-size: 0.7rem; text-align: right; color: #64748b; margin-top: 6px; }
    .h-item { background: #0f172a60; border-left: 3px solid #38bdf8; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.75rem; }
    .h-time { color: #38bdf8; font-weight: 600; margin-bottom: 2px; }
    .h-vals { display: flex; gap: 10px; color: #cbd5e1; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="box">
  <div class="card">
    <div class="head">
      <h3>📈 Canlı Piyasa</h3>
      <button onclick="load()">🔄 Yenile</button>
    </div>
    <div id="list"></div>
    <div id="time" class="time">Yükleniyor...</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px; font-size:0.85rem; color:#94a3b8">⏱️ DEĞİŞİM GEÇMİŞİ (SON 10)</h3>
    <div id="history"><div style="color:#64748b; font-size:0.75rem; text-align:center">Değişim bekleniyor...</div></div>
  </div>
</div>

<script>
const FIELDS = [
  { id: 'usd', name: 'Dolar (USD)', fmt: v => `₺${v.toFixed(4)}`, short: 'USD' },
  { id: 'eur', name: 'Euro (EUR)', fmt: v => `₺${v.toFixed(4)}`, short: 'EUR' },
  { id: 'gold', name: 'Gram Altın (24K)', fmt: v => `₺${v.toFixed(2)}`, short: '24K' },
  { id: 'gold22', name: '22 Ayar Altın', fmt: v => `₺${v.toFixed(2)}`, short: '22K' }
];

let lastData = null, history = [], fetching = false;

// HTML İskeletini dinamik oluştur (Tekrar eden HTML kodlarını engeller)
document.getElementById('list').innerHTML = FIELDS.map(f => 
  `<div class="row"><span>${f.name}</span><span id="${f.id}" class="val">-</span></div>`
).join('');

async function load() {
  if (fetching) return;
  fetching = true;
  try {
    const [c, g] = await Promise.all([
      fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json()),
      fetch('https://api.gold-api.com/price/XAU').then(r => r.json())
    ]);

    const usd = c.rates.TRY, eur = usd / c.rates.EUR, g24 = (g.price * usd) / 31.1035;
    const curr = { usd, eur, gold: g24, gold22: g24 * 0.916 };
    const t = new Date().toLocaleTimeString('tr-TR');

    FIELDS.forEach(f => document.getElementById(f.id).innerText = f.fmt(curr[f.id]));
    document.getElementById('time').innerText = `Son Kontrol: ${t}`;

    if (lastData) {
      const diffs = FIELDS.filter(f => f.fmt(curr[f.id]) !== f.fmt(lastData[f.id]));
      if (diffs.length) {
        history.unshift({ t, diffs: diffs.map(f => `${f.short}: ${f.fmt(curr[f.id])}`) });
        if (history.length > 10) history.pop();
        
        document.getElementById('history').innerHTML = history.map(h => `
          <div class="h-item">
            <div class="h-time">${h.t}</div>
            <div class="h-vals">${h.diffs.map(d => `<span>${d}</span>`).join('')}</div>
          </div>
        `).join('');
      }
    }
    lastData = curr;
  } catch {
    document.getElementById('time').innerText = 'Bağlantı hatası';
  } finally {
    fetching = false;
  }
}

load();
setInterval(load, 5000); // API kilitlenmesini önlemek için 10 saniye idealdir
</script>

</body>
</html>
