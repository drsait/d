<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Güneş Sistemi KML</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}body{font-family:sans-serif;padding:12px;background:#0f172a;color:#fff;margin:0;display:flex;justify-content:center}
    .card{background:#1e293b;padding:16px;border-radius:10px;width:100%;max-width:440px}
    #map{height:220px;border-radius:6px;margin-bottom:8px}
    .row{display:flex;gap:8px}.col{flex:1}
    label{display:block;margin:6px 0 2px;font-size:11px;color:#94a3b8}
    input{width:100%;padding:8px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:4px;font-size:13px}
    button{width:100%;padding:10px;border:none;font-weight:600;border-radius:4px;cursor:pointer;margin-top:8px}
    .b-geo{background:#2563eb;color:#fff}.b-kml{background:#f59e0b;color:#000;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <div id="map"></div>
    <button class="b-geo" onclick="locate()">📍 Cihazımın Konumunu Al</button>
    <div class="row">
      <div class="col"><label>Enlem</label><input id="lat" value="37.313345"></div>
      <div class="col"><label>Boylam</label><input id="lng" value="40.738034"></div>
    </div>
    <label>Yükseklik (m)</label><input id="alt" type="number" value="1200">
    <button class="b-kml" onclick="downloadKML()">KML İndir</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const P = [
      {n:"Merkür",r:"3.5 mm",a:41.58,e:.2056,c:"ff33ff33",s:.8},{n:"Venüs",r:"8.7 mm",a:77.69,e:.0068,c:"ff00ffff",s:.9},
      {n:"Dünya",r:"9.15 mm",a:107.42,e:.0167,c:"ffffaa00",s:.9},{n:"Mars",r:"4.9 mm",a:163.67,e:.0934,c:"ff0000ff",s:.8},
      {n:"Jüpiter",r:"10 cm",a:558.86,e:.0484,c:"ff00a5ff",s:1.4},{n:"Satürn",r:"8.4 cm",a:1026.35,e:.0541,c:"ff55ffff",s:1.3},
      {n:"Uranüs",r:"3.6 cm",a:2061.45,e:.0472,c:"ffffff00",s:1.1},{n:"Neptün",r:"3.5 cm",a:3230.02,e:.0086,c:"ffff00aa",s:1.1}
    ];

    const $ = id => document.getElementById(id);
    const map = L.map('map').setView([+$('lat').value, +$('lng').value], 15);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19}).addTo(map);
    const marker = L.marker([+$('lat').value, +$('lng').value], {draggable:true}).addTo(map);

    const setCoords = (lat, lng) => {
      $('lat').value = lat.toFixed(6);
      $('lng').value = lng.toFixed(6);
      marker.setLatLng([lat, lng]);
    };

    marker.on('dragend', e => setCoords(e.target.getLatLng().lat, e.target.getLatLng().lng));
    map.on('click', e => setCoords(e.latlng.lat, e.latlng.lng));

    function locate() {
      navigator.geolocation?.getCurrentPosition(p => {
        setCoords(p.coords.latitude, p.coords.longitude);
        map.setView([p.coords.latitude, p.coords.longitude], 17);
      }, err => alert(err.message), {enableHighAccuracy:true});
    }

    function downloadKML() {
      const [lat, lng, alt] = [+$('lat').value, +$('lng').value, +$('alt').value];
      const mLat = 1 / 111139, mLng = 1 / (111139 * Math.cos(lat * Math.PI / 180));
      let styles = `<Style id="s_sun"><IconStyle><scale>2</scale><color>ff00bbff</color><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style>`;
      let marks = `<Placemark><name>Güneş (1m)</name><styleUrl>#s_sun</styleUrl><Point><altitudeMode>absolute</altitudeMode><coordinates>${lng},${lat},${alt}</coordinates></Point></Placemark>`;

      P.forEach((p, i) => {
        styles += `<Style id="s${i}"><IconStyle><scale>${p.s}</scale><color>${p.c}</color><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style><Style id="o${i}"><LineStyle><color>${p.c}</color><width>2</width></LineStyle></Style>`;
        marks += `<Placemark><name>${p.n} (${p.r})</name><styleUrl>#s${i}</styleUrl><Point><altitudeMode>absolute</altitudeMode><coordinates>${(lng + p.a * mLng).toFixed(6)},${lat.toFixed(6)},${alt}</coordinates></Point></Placemark>`;

        const b = p.a * Math.sqrt(1 - p.e * p.e), c = p.a * p.e;
        let coords = Array.from({length: 37}, (_, k) => {
          const t = (k / 36) * Math.PI * 2;
          return `${(lng + (c + p.a * Math.cos(t)) * mLng).toFixed(6)},${(lat + b * Math.sin(t) * mLat).toFixed(6)},${alt}`;
        }).join(' ');

        marks += `<Placemark><name>${p.n} Yörüngesi</name><styleUrl>#o${i}</styleUrl><LineString><altitudeMode>absolute</altitudeMode><coordinates>${coords}</coordinates></LineString></Placemark>`;
      });

      const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Güneş Sistemi</name>${styles}<Folder><name>Gezegenler</name>${marks}</Folder></Document></kml>`;
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob([kml], {type:'application/vnd.google-earth.kml+xml'})),
        download: `Gunes_Sistemi_${lat.toFixed(3)}_${lng.toFixed(3)}.kml`
      });
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
