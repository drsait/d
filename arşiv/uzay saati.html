<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Uzay Saati</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#020208;color:#f8fafc;font-family:sans-serif;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
.main{display:flex;align-items:center;gap:2.5vmin;z-index:2}
.c-box{display:flex;flex-direction:column;align-items:center;gap:2vmin}
.clock{width:65vmin;height:65vmin;border:1vmin solid rgba(56,189,248,.5);border-radius:50%;position:relative}
.num{position:absolute;width:100%;height:100%;text-align:center;font-size:3.5vmin;font-weight:700;padding-top:2vmin;text-shadow:0 0 10px rgba(56,189,248,.8)}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:6px;z-index:5}
.h{width:1.5vmin;height:24%;margin-left:-.75vmin;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.m{width:1vmin;height:34%;margin-left:-.5vmin;background:#cbd5e1}
.s{width:.5vmin;height:40%;margin-left:-.25vmin;background:#38bdf8;z-index:6;box-shadow:0 0 12px #38bdf8}
.dot{width:3vmin;height:3vmin;background:#38bdf8;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:10;box-shadow:0 0 15px #38bdf8}
.dig{border:2px solid rgba(56,189,248,.4);padding:1vmin 2.5vmin;border-radius:10px;font-size:2.8vmin;font-weight:700;letter-spacing:2px;color:#38bdf8;text-shadow:0 0 10px rgba(56,189,248,.6)}
.side{display:flex;flex-direction:column;gap:1.5vmin}
.box{border:2px solid rgba(56,189,248,.4);padding:2vmin 2.5vmin;border-radius:12px;text-align:center;min-width:16vmin}
.t{font-size:1.4vmin;color:#38bdf8;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5vmin;font-weight:600}
.v{font-size:2.3vmin;font-weight:700;text-shadow:0 0 8px rgba(255,255,255,.5)}
</style>
</head>
<body>

<canvas id="cvs"></canvas>

<div class="main">
    <div class="c-box">
        <div class="clock" id="cl">
            <div class="hand h" id="ih"></div>
            <div class="hand m" id="im"></div>
            <div class="hand s" id="is"></div>
            <div class="dot"></div>
        </div>
        <div class="dig" id="dg">00:00:00.000000</div>
    </div>
    <div class="side">
        <div class="box"><div class="t">Gün</div><div class="v" id="dn">-</div></div>
        <div class="box"><div class="t">Tarih</div><div class="v" id="dt">-</div></div>
    </div>
</div>

<script>
const c = document.getElementById('cvs'), x = c.getContext('2d');
let w, h;
const rs = () => { w = c.width = innerWidth; h = c.height = innerHeight; };
onresize = rs; rs();

const st = Array.from({length: 400}, () => ({
    x: (Math.random() - .5) * 2e3, y: (Math.random() - .5) * 2e3,
    z: Math.random() * w, sz: Math.random() * 1.5 + .4,
    c: Math.random() > .3 ? '#fff' : (Math.random() > .5 ? '#38bdf8' : '#c084fc')
}));

const ss = [];
(function addSS(){
    ss.push({x: Math.random()*w, y: Math.random()*(h/2), l: Math.random()*100+50, sp: Math.random()*12+8, a: Math.PI/4+.2*(Math.random()-.5), o: 1});
    setTimeout(addSS, Math.random()*4000+8000);
})();

function loop(){
    x.fillStyle = '#020208'; x.fillRect(0,0,w,h);
    let cx = w/2, cy = h/2;
    
    st.forEach(s => {
        if((s.z -= 1.2) <= 0) s.z = w;
        let k = 250 / s.z, px = s.x * k + cx, py = s.y * k + cy;
        if(px >= 0 && px <= w && py >= 0 && py <= h){
            x.fillStyle = s.c; x.beginPath();
            x.arc(px, py, Math.max(0, (1 - s.z / w) * s.sz * 2), 0, 7);
            x.fill();
        }
    });

    ss.forEach((s, i) => {
        x.strokeStyle = `rgba(255,255,255,${s.o})`; x.lineWidth = 2;
        x.beginPath(); x.moveTo(s.x, s.y);
        x.lineTo(s.x - Math.cos(s.a)*s.l, s.y - Math.sin(s.a)*s.l);
        x.stroke();
        s.x += Math.cos(s.a)*s.sp; s.y += Math.sin(s.a)*s.sp; s.o -= .015;
        if(s.o <= 0) ss.splice(i, 1);
    });
    requestAnimationFrame(loop);
}
loop();

const cl = document.getElementById('cl');
['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'].forEach((n, i) => {
    let d = document.createElement('div');
    d.className = 'num'; d.style.transform = `rotate(${i*30}deg)`;
    d.innerHTML = `<span style="display:inline-block;transform:rotate(-${i*30}deg)">${n}</span>`;
    cl.appendChild(d);
});

function tick(){
    let n = new Date(), hr = n.getHours(), min = n.getMinutes(), sec = n.getSeconds();
    document.getElementById('ih').style.transform = `rotate(${((hr%12)+min/60)*30}deg)`;
    document.getElementById('im').style.transform = `rotate(${(min+sec/60)*6}deg)`;
    document.getElementById('is').style.transform = `rotate(${sec*6}deg)`;
    
    let sub = (n.getMilliseconds() * 1000 + Math.floor(Math.random()*900+100)).toString().padStart(6,'0');
    document.getElementById('dg').textContent = `${String(hr).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${sub}`;
    
    document.getElementById('dn').textContent = n.toLocaleDateString('tr-TR',{weekday:'long'});
    document.getElementById('dt').textContent = n.toLocaleDateString('tr-TR');
    requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
