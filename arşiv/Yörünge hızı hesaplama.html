<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yörünge Hızı Simülatörü</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      overflow-x: hidden;
    }
    #warp-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 20px;
    }
    .header-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }
    .sort-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .sort-btn {
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #cbd5e1;
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }
    .sort-btn.active {
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .input-row label {
      font-size: 0.85rem;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 0 5px #000;
    }
    .num-box {
      display: flex;
      align-items: center;
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      padding: 4px 10px;
    }
    .num-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      width: 125px;
      text-align: right;
      outline: none;
      text-shadow: 0 0 5px #000;
    }
    .num-box span {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-left: 6px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      margin: 8px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      cursor: pointer;
    }
    .chips {
      display: flex;
      gap: 6px;
    }
    .chip-btn {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 5px 0;
      font-size: 0.72rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #fff;
    }
    .body-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .body-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 240, 255, 0.5);
    }
    .body-name {
      font-size: 1.05rem;
      font-weight: 700;
      text-shadow: 0 0 8px #000, 0 0 3px #000;
    }
    .body-meta {
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-top: 2px;
      text-shadow: 0 0 6px #000;
    }
    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .metric-title {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
      text-shadow: 0 0 6px #000;
    }
    .metric-val {
      font-size: 1.05rem;
      font-weight: bold;
      color: #38ef7d;
      text-shadow: 0 0 8px rgba(56, 239, 125, 0.4), 0 0 4px #000;
    }
    .metric-unit {
      font-size: 0.7rem;
      font-weight: normal;
      color: #94a3b8;
    }
    @media (max-width: 520px) {
      .body-card {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 6px;
      }
      .metric {
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <canvas id="warp-canvas"></canvas>

  <div class="main-container">
    <div class="panel header-panel">
      <h1>Yörünge Hızı Simülatörü</h1>

      <div class="sort-controls">
        <button id="btnDist" class="sort-btn active" onclick="setSort('distance')">Güneş'e Mesafe</button>
        <button id="btnSize" class="sort-btn" onclick="setSort('size')">Büyüklük (Yarıçap)</button>
      </div>

      <div>
        <div class="input-row">
          <label for="numInput">Yüzeyden Yükseklik</label>
          <div class="num-box">
            <input type="text" id="numInput" value="0" autocomplete="off">
            <span>km</span>
          </div>
        </div>
        <input type="range" id="rangeInput" min="0" max="100000" step="50" value="0">
        <div class="chips">
          <button class="chip-btn" onclick="applyVal(0)">0 km</button>
          <button class="chip-btn" onclick="applyVal(230)">230 km</button>
          <button class="chip-btn" onclick="applyVal(400)">400 km</button>
          <button class="chip-btn" onclick="applyVal(10000)">10.000 km</button>
          <button class="chip-btn" onclick="applyVal(35786)">35.786 km</button>
        </div>
      </div>
    </div>

    <div id="bodies-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <script>
    const canvas = document.getElementById('warp-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, cx, cy;
    const numStars = 350;
    let stars = [];
    let shootingStars = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    for (let i = 0; i < numStars; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width,
        pz: 0,
        baseSize: 2.2 + Math.random() * 2.8
      });
      stars[i].pz = stars[i].z;
    }

    function addShootingStar() {
      shootingStars.push({
        x: Math.random() * width,
        y: Math.random() * (height / 2),
        len: 90 + Math.random() * 60,
        speed: 6 + Math.random() * 4,
        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
        opacity: 1
      });
    }

    function draw() {
      ctx.fillStyle = '#010308';
      ctx.fillRect(0, 0, width, height);

      const speed = 0.55;

      for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        s.z -= speed;

        if (s.z <= 0) {
          s.z = width;
          s.x = (Math.random() - 0.5) * width * 2;
          s.y = (Math.random() - 0.5) * height * 2;
          s.pz = width;
        }

        const k = 250 / s.z;
        const px = s.x * k + cx;
        const py = s.y * k + cy;

        const pk = 250 / s.pz;
        const ppx = s.x * pk + cx;
        const ppy = s.y * pk + cy;

        s.pz = s.z;

        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          const shade = Math.min(1, (1 - s.z / width) * 1.5);
          const size = Math.max(1.8, (1 - s.z / width) * s.baseSize * 2.2);

          ctx.beginPath();
          ctx.moveTo(ppx, ppy);
          ctx.lineTo(px, py);
          ctx.strokeStyle = `rgba(215, 235, 255, ${shade})`;
          ctx.lineWidth = size;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }

      if (Math.random() < 0.0075) {
        addShootingStar();
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        const tailX = ss.x - Math.cos(ss.angle) * ss.len;
        const tailY = ss.y - Math.sin(ss.angle) * ss.len;

        const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(1, `rgba(255, 255, 255, ${ss.opacity})`);

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(ss.x, ss.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.stroke();

        ss.x += Math.cos(ss.angle) * ss.speed;
        ss.y += Math.sin(ss.angle) * ss.speed;
        ss.opacity -= 0.009;

        if (ss.opacity <= 0 || ss.x > width || ss.y > height) {
          shootingStars.splice(i, 1);
        }
      }

      requestAnimationFrame(draw);
    }
    draw();

    let bodies = [
      { name: 'Güneş', gm: 132712440018, r: 696340, dist: 0, color: '#ffb300' },
      { name: 'Merkür', gm: 22032, r: 2439.7, dist: 57.9, color: '#b0bec5' },
      { name: 'Venüs', gm: 324859, r: 6051.8, dist: 108.2, color: '#ffe082' },
      { name: 'Dünya', gm: 398600.4418, r: 6371, dist: 149.6, color: '#00f0ff' },
      { name: 'Ay', gm: 4902.8, r: 1737.4, dist: 149.98, color: '#e2e8f0' },
      { name: 'Mars', gm: 42828, r: 3389.5, dist: 227.9, color: '#ff7043' },
      { name: 'Jüpiter', gm: 126686534, r: 69911, dist: 778.6, color: '#ffab91' },
      { name: 'Satürn', gm: 37931187, r: 58232, dist: 1433.5, color: '#fff59d' },
      { name: 'Uranüs', gm: 5793939, r: 25362, dist: 2872.5, color: '#80deea' },
      { name: 'Neptün', gm: 6836529, r: 24622, dist: 4495.1, color: '#81d4fa' },
      { name: 'Plüton', gm: 871, r: 1188.3, dist: 5906.4, color: '#d7ccc8' }
    ];

    let currentSort = 'distance';
    const listEl = document.getElementById('bodies-list');

    function renderList() {
      if (currentSort === 'distance') {
        bodies.sort((a, b) => a.dist - b.dist);
      } else {
        bodies.sort((a, b) => b.r - a.r);
      }

      listEl.innerHTML = '';
      bodies.forEach(b => {
        const div = document.createElement('div');
        div.className = 'body-card';
        div.id = `card-${b.name}`;
        div.innerHTML = `
          <div>
            <div class="body-name" style="color: ${b.color};">${b.name}</div>
            <div class="body-meta">Yarıçap: ${Math.round(b.r).toLocaleString('tr-TR')} km | Güneş'e Mesafe: ${b.dist.toLocaleString('tr-TR')}M km</div>
          </div>
          <div class="metric">
            <div class="metric-title">Saniyelik Hız</div>
            <div class="metric-val" id="kms-${b.name}">-</div>
          </div>
          <div class="metric">
            <div class="metric-title">Saatlik Hız</div>
            <div class="metric-val" id="kmh-${b.name}">-</div>
          </div>
        `;
        listEl.appendChild(div);
      });

      calculateAll(document.getElementById('rangeInput').value);
    }

    function calculateAll(h) {
      let alt = parseFloat(h);
      if (isNaN(alt) || alt < 0) alt = 0;

      bodies.forEach(b => {
        const totalR = b.r + alt;
        const v_kms = Math.sqrt(b.gm / totalR);
        const v_kmh = v_kms * 3600;

        const kmsEl = document.getElementById(`kms-${b.name}`);
        const kmhEl = document.getElementById(`kmh-${b.name}`);
        if (kmsEl && kmhEl) {
          kmsEl.innerHTML = `${v_kms.toFixed(2)} <span class="metric-unit">km/s</span>`;
          kmhEl.innerHTML = `${Math.round(v_kmh).toLocaleString('tr-TR')} <span class="metric-unit">km/sa</span>`;
        }
      });
    }

    function setSort(type) {
      currentSort = type;
      document.getElementById('btnDist').classList.toggle('active', type === 'distance');
      document.getElementById('btnSize').classList.toggle('active', type === 'size');
      renderList();
    }

    const range = document.getElementById('rangeInput');
    const num = document.getElementById('numInput');

    function formatNumber(val) {
      return Number(val).toLocaleString('tr-TR');
    }

    range.addEventListener('input', (e) => {
      num.value = formatNumber(e.target.value);
      calculateAll(e.target.value);
    });

    num.addEventListener('input', (e) => {
      let rawVal = e.target.value.replace(/\D/g, '');
      if (rawVal === '') {
        e.target.value = '';
        calculateAll(0);
        return;
      }
      let numVal = parseInt(rawVal, 10);
      e.target.value = formatNumber(numVal);
      range.value = Math.min(numVal, 100000);
      calculateAll(numVal);
    });

    function applyVal(v) {
      range.value = Math.min(v, 100000);
      num.value = formatNumber(v);
      calculateAll(v);
    }

    renderList();
    applyVal(0);
  </script>
</body>
</html>
