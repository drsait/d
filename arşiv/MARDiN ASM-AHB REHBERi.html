<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARDİN ASM-AHB REHBERİ</title>

<style>
:root{
  --bg:#080c16;
  --card:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.11);
  --text:#f8fafc;
  --muted:#94a3b8;
  --blue:#38bdf8;
  --purple:#a78bfa;
  --pink:#f472b6;
  --green:#34d399;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  padding:20px 12px 70px;
  overflow-x:hidden;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 5%,rgba(99,102,241,.20),transparent 28%),
    radial-gradient(circle at 92% 88%,rgba(236,72,153,.17),transparent 30%),
    linear-gradient(135deg,#080c16,#0b1020 50%,#090d18);
}

/* Hafif renkli arka plan hareketi */
body:before,
body:after{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
  opacity:.12;
}

body:before{
  background:#6366f1;
  top:-150px;
  left:-100px;
  animation:float1 14s ease-in-out infinite alternate;
}

body:after{
  background:#ec4899;
  right:-120px;
  bottom:-100px;
  animation:float2 17s ease-in-out infinite alternate;
}

@keyframes float1{
  to{transform:translate(100px,80px)}
}

@keyframes float2{
  to{transform:translate(-80px,-70px)}
}

.cnt{
  width:min(940px,100%);
  margin:auto;
  position:relative;
  z-index:1;
}

header{
  text-align:center;
  margin-bottom:20px;
}

h1{
  font-size:clamp(1.65rem,5vw,2.25rem);
  font-weight:900;
  letter-spacing:-.04em;
  background:linear-gradient(100deg,#38bdf8,#a78bfa,#f472b6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  user-select:none;
}

/* İSTATİSTİK KARTLARI */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0;
}

.sc{
  position:relative;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:13px 8px;
  text-align:center;
  cursor:pointer;
  user-select:none;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.sc:before{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  left:50%;
  top:-55px;
  transform:translateX(-50%);
  background:rgba(255,255,255,.08);
  pointer-events:none;
}

.sc:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

/* TÜM KARTLARDA AYNI BASILMA EFEKTİ */

.sc.pressed{
  transform:scale(.94) translateY(2px);
  border-color:rgba(165,180,252,.55);
  box-shadow:
    0 3px 10px rgba(99,102,241,.3),
    inset 0 0 12px rgba(255,255,255,.05);
}

.sc-l{
  color:var(--muted);
  font-size:.68rem;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.sc-v{
  display:inline-block;
  margin-top:3px;
  font-size:1.65rem;
  font-weight:900;
}

.bump{
  animation:bump .28s ease;
}

@keyframes bump{
  50%{transform:scale(1.2)}
}

/* FİLTRE */

.flt{
  display:flex;
  gap:9px;
  margin-bottom:18px;
  padding:11px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:16px;
}

input,
select{
  min-width:0;
  padding:11px 14px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:11px;
  outline:none;
  background:#111827;
  color:white;
  font-size:.9rem;
}

input{
  flex:1;
}

input:focus,
select:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 2px rgba(139,92,246,.18);
}

select option{
  background:#111827;
  color:white;
}

/* ASM KARTI */

.card{
  overflow:hidden;
  margin-bottom:14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.085);
  border-radius:17px;
  animation:cardIn .25s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.card:hover{
  border-color:rgba(255,255,255,.19);
}

.c-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 17px;
  background:rgba(255,255,255,.025);
  border-bottom:1px solid rgba(255,255,255,.055);
}

.asm-l{
  min-width:0;
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#f1f5f9;
  text-decoration:none;
  font-size:1rem;
  font-weight:800;
}

.asm-l:hover{
  color:#a5b4fc;
}

.asm-l span:last-child{
  overflow:hidden;
  text-overflow:ellipsis;
}

.dot{
  flex:none;
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(135deg,#06b6d4,#6366f1);
  box-shadow:0 0 7px rgba(56,189,248,.7);
}

.btn{
  flex:none;
  padding:6px 12px;
  border:1px solid rgba(165,180,252,.3);
  border-radius:999px;
  color:#c7d2fe;
  background:rgba(99,102,241,.13);
  text-decoration:none;
  font-size:.74rem;
  font-weight:800;
  transition:.15s ease;
}

.btn:hover{
  color:white;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  transform:scale(1.04);
}

/* AHB GRID */

.cg{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:9px;
  padding:14px 17px;
}

.gi{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  min-width:0;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:10px;
  background:rgba(255,255,255,.025);
  transition:.15s ease;
}

.gi:hover{
  background:rgba(255,255,255,.065);
  transform:translateY(-1px);
}

.ab{
  display:inline-block;
  padding:5px 9px;
  border:1px solid rgba(147,197,253,.18);
  border-radius:7px;
  color:#93c5fd;
  background:rgba(255,255,255,.055);
  text-decoration:none;
  font-size:.82rem;
  font-weight:800;
  white-space:nowrap;
}

.ab:hover{
  color:white;
  background:rgba(59,130,246,.25);
}

.mb{
  flex:none;
  padding:2px 7px;
  border-radius:999px;
  color:white;
  background:linear-gradient(135deg,#ec4899,#8b5cf6);
  font-size:.68rem;
  font-weight:900;
  animation:miniPulse 1.5s ease-in-out infinite;
}

@keyframes miniPulse{
  50%{transform:scale(1.07)}
}

/* DOKTOR GÖRÜNÜMÜ */

table{
  width:100%;
  border-collapse:collapse;
  font-size:.9rem;
}

th{
  padding:9px 17px;
  color:#64748b;
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:left;
  font-size:.7rem;
  letter-spacing:.05em;
}

td{
  padding:10px 17px;
  color:#e2e8f0;
  border-bottom:1px solid rgba(255,255,255,.035);
}

tr:last-child td{
  border-bottom:0;
}

tr:hover td{
  background:rgba(255,255,255,.025);
}

.w21{
  width:210px;
}

.uzm{
  color:#38bdf8;
  font-weight:700;
}

.vac{
  padding:2px 7px;
  border:1px solid rgba(248,113,113,.3);
  border-radius:6px;
  color:#f87171;
  background:rgba(239,68,68,.15);
  font-size:.72rem;
  font-weight:800;
}

/* EŞLEŞEN KAYIT */

.gi.hl,
tr.hl{
  background:
    linear-gradient(
      90deg,
      rgba(236,72,153,.27),
      rgba(139,92,246,.22),
      rgba(6,182,212,.18)
    ) !important;
}

tr.hl td{
  color:white !important;
  font-weight:700;
}

tr.hl .ab{
  color:white;
  background:#f43f5e;
  border-color:#fda4af;
}

/* GİZLİ MOD */

body.gd th.cd,
body.gd td.cd,
body.gd table{
  display:none;
}

body.gd .cg{
  display:grid;
}

body.gd .gi{
  display:flex;
}

/* BOŞ SONUÇ */

.emp{
  padding:45px 20px;
  border:1px dashed rgba(255,255,255,.14);
  border-radius:17px;
  text-align:center;
  color:#94a3b8;
  background:rgba(255,255,255,.025);
}

/* MOBİL */

@media(max-width:640px){

  body{
    padding:14px 9px 50px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .flt{
    flex-direction:column;
  }

  .c-head{
    padding:12px;
  }

  .cg{
    grid-template-columns:repeat(2,1fr);
    padding:11px;
    gap:7px;
  }

  .gi{
    padding:7px;
  }

  .ab{
    font-size:.73rem;
  }

  table{
    font-size:.8rem;
  }

  th,
  td{
    padding:9px 10px;
  }

  .w21{
    width:145px;
  }
}

@media(max-width:380px){

  .cg{
    grid-template-columns:1fr;
  }

  .c-head{
    align-items:flex-start;
  }

  .asm-l{
    font-size:.87rem;
  }

  .btn{
    font-size:.68rem;
    padding:5px 9px;
  }
}

/* Daha az hareket isteyen sistemlerde animasyonları azalt */
@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

const S_U="https://www.google.com/search?udm=50&q=";

const S_A=
" resmi web sayfası ve iletişim bilgilerini, asmde çalışan tüm aile hekimlerinin ve aile sağlığı çalışanlarının adı soyadı çalıştığı birimin numarasıyla birlikte detaylı ve ayrıntılı bir şekilde bul ve tablo yap. her birimi ayrı satıra ayrı ayrı yaz";

const S_B=
" nolu aile hekimliği biriminin resmi web sayfasını ve iletişim bilgilerini, çalışan aile hekimi ve aile sağlığı çalışanın adı soyadını detaylı ve ayrıntılı bul, tablo olarak listele";


/* =========================================================
   SAYILARI GÜNCELLE
   ========================================================= */

function aV(id,v){

  const e=$(id);

  if(e.textContent===String(v))return;

  e.textContent=v;

  e.classList.remove('bump');

  requestAnimationFrame(()=>{
    e.classList.add('bump');
  });
}


/* =========================================================
   RENDER
   ========================================================= */

function rnd(items,q=''){

  let totalAHB=0;
  let totalExpert=0;
  let matches=0;

  const query=q.toLowerCase();

  for(const x of items){

    totalAHB+=x.u.length;

    for(const u of x.u){

      if(u.h.includes('(uzman)'))
        totalExpert++;

      if(
        query &&
        (
          u.n.includes(query) ||
          u.h.toLowerCase().includes(query) ||
          x.a.toLowerCase().includes(query)
        )
      ){
        matches++;
      }
    }
  }

  aV('sa',items.length);
  aV('sh',totalAHB);
  aV('sm',query?matches:totalAHB);
  aV('su',totalExpert);

  if(!items.length){

    lE.innerHTML=
      '<div class="emp">✨🔍✨<br><br>Eşleşen kayıt bulunamadı.</div>';

    return;
  }


  const html=[];

  items.forEach((x,idx)=>{

    const aL=
      S_U+
      encodeURIComponent(
        'Mardin '+x.a+S_A
      );

    html.push(`
      <div class="card" style="animation-delay:${Math.min(idx*.012,.2)}s">

        <div class="c-head">

          <a
            href="${aL}"
            target="_blank"
            rel="noopener"
            class="asm-l"
          >
            <span class="dot"></span>
            <span>${x.a}</span>
          </a>

          <a
            href="${aL}"
            target="_blank"
            rel="noopener"
            class="btn"
          >
            İletişim ↗
          </a>

        </div>
    `);


    /* =====================================================
       GİZLİ DOKTOR İSİMLERİ KAPALIYSA
       ===================================================== */

    if(!dr){

      html.push('<div class="cg">');

      for(const u of x.u){

        const m=
          query &&
          (
            u.n.includes(query) ||
            u.h.toLowerCase().includes(query)
          );

        const hL=
          S_U+
          encodeURIComponent(
            `Mardin ${x.i} ${x.a} ${u.n}${S_B}`
          );

        html.push(`
          <div class="gi${m?' hl':''}">

            <a
              href="${hL}"
              target="_blank"
              rel="noopener"
              class="ab"
            >
              ${u.n} Nolu AHB
            </a>

            ${m?'<span class="mb">⚡</span>':''}

          </div>
        `);
      }

      html.push('</div></div>');

    }

    /* =====================================================
       DOKTOR İSİMLERİ AÇIKSA
       ===================================================== */

    else{

      html.push(`
        <table>
          <thead>
            <tr>
              <th class="w21">Birim No</th>
              <th class="cd">Aile Hekimi</th>
            </tr>
          </thead>
          <tbody>
      `);

      for(const u of x.u){

        const m=
          query &&
          (
            u.n.includes(query) ||
            u.h.toLowerCase().includes(query)
          );

        let H;

        if(u.h.includes('BOŞ')){

          H='<span class="vac">BOŞ BİRİM</span>';

        }else if(u.h.includes('(uzman)')){

          H=
            u.h.replace(
              '(uzman)',
              '<span class="uzm">(uzman)</span>'
            );

        }else{

          H=u.h;
        }

        const hL=
          S_U+
          encodeURIComponent(
            `Mardin ${x.i} ${x.a} ${u.n}${S_B}`
          );

        html.push(`
          <tr class="${m?'hl':''}">

            <td class="w21">

              <a
                href="${hL}"
                target="_blank"
                rel="noopener"
                class="ab"
              >
                ${u.n} Nolu AHB
              </a>

            </td>

            <td class="cd">
              ${H}
              ${m?'<span class="mb">⚡ Aranan</span>':''}
            </td>

          </tr>
        `);
      }

      html.push('</tbody></table></div>');
    }

  });

  lE.innerHTML=html.join('');
}

  const d=dI.value;

  const result=[];

    if(d && x.i!==d)

    const asmMatch=x.a.toLowerCase().includes(q);

    const unitMatch=
      !q ||
      asmMatch ||
      x.u.some(u=>
        u.n.includes(q) ||
        u.h.toLowerCase().includes(q)
      );

    if(unitMatch)
      result.push(x);
  }

  rnd(result,q);
}


/* =========================================================
   KARTLAR
   =========================================================

   TÜM KARTLAR:
   → Aynı basılma animasyonu.

   SADECE EŞLEŞEN:
   → 1 saniyede 5 tıklamayı sayar.
   → 5. tıklamada doktor isimlerini açar/kapatır.
   ========================================================= */

let matchClicks=0;
let matchTimer=null;

document.querySelectorAll('.sc').forEach(card=>{

  card.addEventListener('click',()=>{

    /* HER KARTTA AYNI ANİMASYON */

    card.classList.remove('pressed');

    requestAnimationFrame(()=>{
      card.classList.add('pressed');

      setTimeout(()=>{
        card.classList.remove('pressed');
      },120);
    });


    /* SADECE EŞLEŞEN KARTI İŞLE */

    if(card!==matchCard)
      return;


    matchClicks++;

    clearTimeout(matchTimer);

    matchTimer=setTimeout(()=>{
      matchClicks=0;
    },1000);


    /* 5 HIZLI TIKLAMA */

    if(matchClicks>=5){

      dr=!dr;

      document.body.classList.toggle(
        'gd',
        !dr
      );

      fl();

      matchClicks=0;

      clearTimeout(matchTimer);
    }

  });

});


/* =========================================================
   ARAMA
   ========================================================= */

let searchFrame=0;

qI.addEventListener('input',()=>{

  cancelAnimationFrame(searchFrame);

  searchFrame=requestAnimationFrame(fl);

});

dI.addEventListener('change',fl);

   İLK YÜKLEME
   ========================================================= */

rnd(dat);
