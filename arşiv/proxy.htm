<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Proxy & Arşiv</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --accent: #6366f1; --accent-hover: #4f46e5;
      --text: #f8fafc; --text-muted: #94a3b8;
      --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .top-bar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: var(--card); padding: 8px 12px;
      display: flex; flex-direction: column; gap: 8px;
      border-bottom: 1px solid var(--border); z-index: 1000;
      transition: transform 0.3s ease;
    }
    .top-bar.hidden { transform: translateY(-100%); }
    .top-bar-row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    input[type="text"], input[type="password"] {
      width: 100%; background: #0b1120; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 9px 36px 9px 12px;
      font-size: 13px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn-clear {
      position: absolute; right: 10px; background: none; border: none;
      color: var(--text-muted); font-size: 15px; cursor: pointer; display: none; line-height: 1;
    }
    .btn-clear:hover { color: #fff; }
    .toggle-label {
      display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: var(--text-muted); white-space: nowrap; cursor: pointer; user-select: none;
    }
    .toggle-label input { cursor: pointer; accent-color: var(--accent); width: 15px; height: 15px; }
    button {
      border: none; border-radius: 8px; padding: 8px 12px; font-weight: 600;
      font-size: 13px; cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center;
      transition: 0.2s; color: #fff;
    }
    button:active { transform: scale(0.98); }
    .btn-accent { background: var(--accent); }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); }
    .btn-outline { background: var(--border); }
    .btn-outline:hover { background: #475569; }
    .viewport { flex: 1; width: 100%; height: 100%; position: relative; }
    iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .hover-trigger { position: fixed; top: 0; left: 0; width: 100%; height: 15px; z-index: 999; }
    .status-badge {
      position: absolute; bottom: 16px; right: 16px;
      background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 10;
    }
    #archiveModal {
      display: none; position: fixed; inset: 0; background: var(--bg);
      z-index: 2000; flex-direction: column; height: 100vh; width: 100vw;
    }
    .modal-header-clean {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      flex-shrink: 0; z-index: 2010;
    }
    .modal-body {
      padding: 10px; display: flex; flex-direction: column;
      flex-shrink: 0; position: relative; gap: 4px;
    }
    .editor-wrapper { position: relative; width: 100%; display: flex; }
    #archiveModal.fs-mode .modal-body { flex: 1; min-height: 0; padding: 10px; }
    #archiveModal.fs-mode .editor-wrapper { height: 100%; }
    #archiveModal.fs-mode .modal-footer-clean { display: none; }
    textarea {
      width: 100%; height: 130px; min-height: 80px; max-height: 65vh;
      background: #0b1120; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px; line-height: 1.4; outline: none;
      resize: vertical; overflow-y: auto;
    }
    #archiveModal.fs-mode textarea { height: 100% !important; max-height: 100% !important; resize: none; }
    .btn-fs-pill {
      position: absolute; top: 8px; right: 14px;
      background: rgba(30, 41, 59, 0.85); border: 1px solid var(--border);
      font-size: 11px; padding: 4px 8px; border-radius: 6px;
      color: var(--text-muted); cursor: pointer; z-index: 5;
    }
    .btn-fs-pill:hover { background: var(--accent); color: #fff; }
    .code-meta {
      font-size: 11px; color: var(--text-muted);
      display: flex; justify-content: flex-end; gap: 12px;
      padding-right: 4px; user-select: none;
    }
    .modal-footer-clean {
      flex: 1; display: flex; flex-direction: column; justify-content: space-evenly;
      gap: 10px; background: var(--card); border-top: 1px solid var(--border); padding: 14px 10px;
      overflow-y: auto;
    }
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .btn-grid button { padding: 14px 8px; font-size: 14px; }
    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 500px) {
      .btn-grid { grid-template-columns: repeat(2, 1fr); }
      .inputs-grid { grid-template-columns: 1fr; }
    }
    #previewModal {
      display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #fff; z-index: 99999;
    }
    #floatingCloseBtn {
      position: fixed; top: 16px; right: 16px; width: 42px; height: 42px;
      border-radius: 50%; background: var(--danger); color: #fff; font-size: 18px;
      font-weight: bold; border: 2px solid #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: grab; z-index: 100000; touch-action: none; user-select: none;
    }
  </style>
</head>
<body>

  <div class="hover-trigger" id="hoverArea"></div>

  <div class="top-bar" id="topBar">
    <div class="input-wrapper">
      <input type="text" id="targetUrl" placeholder="https://example.com" oninput="toggleClearBtn()" onkeydown="if(event.key==='Enter') navigate()">
      <button class="btn-clear" id="btnClear" onclick="clearInput()">✕</button>
    </div>
    <div class="top-bar-row2">
      <label class="toggle-label" title="İşaretlenirse resim ve CSS'ler proxy sunucusundan geçer">
        <input type="checkbox" id="chkProxyMedia">Tam Proxy
      </label>
      <div style="display:flex; gap:8px;">
        <button class="btn-accent" onclick="navigate()" id="btnGo">Git</button>
        <button class="btn-success" onclick="openArchiveTools()">📦 Arşiv</button>
      </div>
    </div>
  </div>

  <div class="viewport">
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="statusBar" class="status-badge">Yükleniyor...</div>
  </div>

  <div id="archiveModal">
    <div class="modal-header-clean">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-weight:600; font-size:15px;">Arşiv</span>
        <label class="toggle-label" title="Tüm resim ve CSS dosyalarını Base64 ile içine gömer">
          <input type="checkbox" id="chkEmbedOffline" onchange="buildArchive()">Dosya Göm
        </label>
        <button class="btn-outline" onclick="$('fileUploadInput').click()" style="padding:4px 8px; font-size:11px;" title="Cihazdan HTML dosyası yükle">📂 Dosya Aç</button>
        <input type="file" id="fileUploadInput" accept=".html,.htm,.txt" style="display:none" onchange="handleLocalFile(event)">
      </div>
      <button class="btn-outline" onclick="closeArchiveModal()">✕ Kapat</button>
    </div>

    <div class="modal-body">
      <div class="editor-wrapper" id="editorWrapper">
        <button class="btn-fs-pill" id="btnToggleFs" onclick="toggleEditorFs()">⛶ Tam Ekran</button>
        <textarea id="codeEditor" placeholder="Kaynak kodlar burada listelenecek..." oninput="updateCodeMeta()"></textarea>
      </div>
      <div class="code-meta">
        <span id="metaChars">0 Karakter</span>
        <span id="metaSize">0 B</span>
      </div>
    </div>

    <div class="modal-footer-clean">
      <div class="btn-grid">
        <button class="btn-outline" onclick="copyCode()" id="btnCopy">Kopyala</button>
        <button class="btn-outline" onclick="downloadCode()">İndir</button>
        <button class="btn-outline" onclick="runCode()">Çalıştır</button>
        <button class="btn-success" onclick="uploadToGithub()">GitHub'a Yükle</button>
      </div>
      <div class="inputs-grid">
        <input type="text" id="fileName" placeholder="Dosya adı">
        <input type="password" id="ghToken" placeholder="GitHub Token">
      </div>
    </div>
  </div>

  <div id="previewModal">
    <button id="floatingCloseBtn" title="Kapat">✕</button>
    <iframe id="preview"></iframe>
  </div>

  <script>
    const REPO = 'drsait/Deneme';
    const PROXY_URL = 'https://polished-snow-38e2.yenibirhesap047.workers.dev';
    
    const $ = id => document.getElementById(id);
    const topBar = $('topBar'), inputUrl = $('targetUrl'), btnClear = $('btnClear');
    let currentRawHtml = '', loadedUrl = '';

    const toggleClearBtn = () => btnClear.style.display = inputUrl.value.trim() ? 'block' : 'none';
    const clearInput = () => { inputUrl.value = ''; toggleClearBtn(); inputUrl.focus(); };

    $('hoverArea').addEventListener('mouseenter', () => topBar.classList.remove('hidden'));

    function setDefaultFileName() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      $('fileName').value = `arsiv_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.html`;
    }
    setDefaultFileName();

    function updateCodeMeta() {
      const val = $('codeEditor').value;
      const chars = val.length;
      const bytes = new Blob([val]).size;
      $('metaChars').textContent = `${chars.toLocaleString('tr-TR')} Karakter`;
      
      let sizeStr = bytes + ' B';
      if (bytes >= 1048576) sizeStr = (bytes / 1048576).toFixed(2) + ' MB';
      else if (bytes >= 1024) sizeStr = (bytes / 1024).toFixed(2) + ' KB';
      
      $('metaSize').textContent = sizeStr;
    }

    const normalizeUrl = u => (!u.startsWith('http://') && !u.startsWith('https://')) ? 'https://' + u : u;

    function toProxyUrl(u, b) {
      try {
        return (!u || u.startsWith('data:') || u.startsWith('javascript:')) ? u : `${PROXY_URL}?url=${encodeURIComponent(new URL(u, b).href)}`;
      } catch { return u; }
    }

    async function fetchResource(u, asB64 = false) {
      try {
        const r = await fetch(`${PROXY_URL}?url=${encodeURIComponent(u)}`);
        if (!r.ok) return null;
        if (!asB64) return await r.text();
        const bl = await r.blob();
        return new Promise(res => {
          const fr = new FileReader();
          fr.onloadend = () => res(fr.result);
          fr.readAsDataURL(bl);
        });
      } catch { return null; }
    }

    async function navigate(override = null) {
      let u = override || inputUrl.value.trim();
      if (!u) return;
      u = normalizeUrl(u);
      inputUrl.value = loadedUrl = u;
      toggleClearBtn();

      const btn = $('btnGo'), st = $('statusBar'), fr = $('proxyFrame'), useProxy = $('chkProxyMedia').checked;
      btn.disabled = true;
      st.style.display = 'block';
      st.textContent = 'Sayfa yükleniyor...';

      try {
        const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(u)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentRawHtml = await res.text();

        const doc = new DOMParser().parseFromString(currentRawHtml, 'text/html'), base = new URL(u);
        let be = doc.querySelector('base') || doc.createElement('base');
        be.href = base.origin + '/';
        if (!be.parentNode) doc.head.prepend(be);

        if (useProxy) {
          doc.querySelectorAll('img, source, video, audio').forEach(e => {
            const s = e.getAttribute('src');
            if (s) e.setAttribute('src', toProxyUrl(s, base));
            e.removeAttribute('srcset');
          });
          doc.querySelectorAll('link[rel="stylesheet"]').forEach(e => {
            const h = e.getAttribute('href');
            if (h) e.setAttribute('href', toProxyUrl(h, base));
          });
        }

        const sc = doc.createElement('script');
        sc.textContent = `
          let lastY = window.scrollY;
          window.addEventListener('scroll', () => {
            const y = window.scrollY;
            window.parent.postMessage({ type: (y > lastY && y > 50) ? 'SCROLL_DOWN' : (y < lastY ? 'SCROLL_UP' : '') }, '*');
            lastY = y;
          }, { passive: true });
          document.addEventListener('click', e => {
            const l = e.target.closest('a');
            if (l?.getAttribute('href') && !l.href.startsWith('javascript:') && !l.getAttribute('href').startsWith('#')) {
              e.preventDefault();
              try { window.parent.postMessage({ type: 'PROXY_NAVIGATE', url: new URL(l.getAttribute('href'), "${base.origin}").href }, '*'); } catch {}
            }
          }, true);
        `;
        doc.head.appendChild(sc);
        fr.srcdoc = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        st.style.display = 'none';
      } catch (err) { st.textContent = 'Hata: ' + err.message; }
      finally { btn.disabled = false; }
    }

    async function buildArchive() {
      let u = inputUrl.value.trim();
      if (!u) return alert('Lütfen bir adres girin.');
      u = normalizeUrl(u);
      inputUrl.value = u;

      const isOffline = $('chkEmbedOffline').checked, ed = $('codeEditor');
      ed.value = 'Sayfa kaynağı alınıyor...';
      updateCodeMeta();
      let rawHtml = (currentRawHtml && loadedUrl === u) ? currentRawHtml : await fetchResource(u, false);
      if (!rawHtml) {
        ed.value = 'Hata: Sayfa içeriği alınamadı.';
        updateCodeMeta();
        return;
      }

      const doc = new DOMParser().parseFromString(rawHtml, 'text/html'), base = new URL(u);

      if (isOffline) {
        ed.value = 'Dosyalar gömülüyor, lütfen bekleyin...';
        updateCodeMeta();
        const linkEls = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
        await Promise.all(linkEls.map(async l => {
          const h = l.getAttribute('href');
          if (h) {
            const css = await fetchResource(new URL(h, base).href, false);
            if (css) {
              const st = doc.createElement('style');
              st.textContent = css;
              l.replaceWith(st);
            }
          }
        }));

        const imgEls = Array.from(doc.querySelectorAll('img')).filter(m => m.getAttribute('src') && !m.getAttribute('src').startsWith('data:'));
        await Promise.all(imgEls.map(async m => {
          const b64 = await fetchResource(new URL(m.getAttribute('src'), base).href, true);
          if (b64) {
            m.setAttribute('src', b64);
            m.removeAttribute('srcset');
            m.removeAttribute('loading');
          }
        }));

        doc.querySelectorAll('base').forEach(b => b.remove());
      } else {
        let be = doc.querySelector('base') || doc.createElement('base');
        be.href = base.origin + '/';
        if (!be.parentNode) doc.head.prepend(be);
      }
      ed.value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      updateCodeMeta();
    }

    function handleLocalFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        $('codeEditor').value = ev.target.result;
        $('fileName').value = file.name;
        updateCodeMeta();
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function toggleEditorFs() {
      const modal = $('archiveModal'), btn = $('btnToggleFs');
      const isFs = modal.classList.toggle('fs-mode');
      btn.textContent = isFs ? '✕ Küçült' : '⛶ Tam Ekran';
    }

    function openArchiveTools() {
      $('archiveModal').style.display = 'flex';
      setDefaultFileName();
      if (inputUrl.value.trim()) buildArchive();
      else updateCodeMeta();
    }

    function closeArchiveModal() {
      if ($('archiveModal').classList.contains('fs-mode')) toggleEditorFs();
      $('archiveModal').style.display = 'none';
    }

    function copyCode() {
      const v = $('codeEditor').value;
      if (!v) return alert('Kod yok.');
      navigator.clipboard.writeText(v).then(() => {
        const b = $('btnCopy'); b.textContent = 'Kopyalandı!';
        setTimeout(() => b.textContent = 'Kopyala', 1500);
      });
    }

    const runCode = () => { $('preview').srcdoc = $('codeEditor').value; $('previewModal').style.display = 'block'; };
    const closePreview = () => $('previewModal').style.display = 'none';

    function downloadCode() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([$('codeEditor').value], { type: 'text/html' }));
      a.download = $('fileName').value.trim() || 'arsiv.html';
      a.click();
    }

    async function uploadToGithub() {
      const t = $('ghToken').value.trim(), p = $('fileName').value.trim() || 'arsiv.html';
      if (!t) return alert('Token gerekli.');

      const url = `https://api.github.com/repos/${REPO}/contents/${p}`;
      try {
        let sha = null;
        const cr = await fetch(url, { headers: { Authorization: `token ${t}` } });
        if (cr.ok) sha = (await cr.json()).sha;

        const res = await fetch(url, {
          method: 'PUT',
          headers: { Authorization: `token ${t}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: `Arşiv: ${p}`, content: btoa(unescape(encodeURIComponent($('codeEditor').value))), sha: sha || undefined })
        });
        alert(res.ok ? `${REPO} reposuna yüklendi!` : 'Hata: ' + (await res.json()).message);
      } catch (e) { alert('İşlem başarısız: ' + e.message); }
    }

    const dragBtn = $('floatingCloseBtn');
    let isDragging = false, startX, startY, initX, initY, moved = false;

    dragBtn.addEventListener('pointerdown', e => {
      isDragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      initX = dragBtn.offsetLeft; initY = dragBtn.offsetTop;
      dragBtn.setPointerCapture(e.pointerId);
    });

    dragBtn.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.hypot(dx, dy) > 3) moved = true;
      dragBtn.style.left = `${initX + dx}px`; dragBtn.style.top = `${initY + dy}px`;
      dragBtn.style.right = 'auto';
    });

    dragBtn.addEventListener('pointerup', () => { isDragging = false; if (!moved) closePreview(); });

    window.addEventListener('message', e => {
      if (!e.data) return;
      if (e.data.type === 'SCROLL_DOWN') topBar.classList.add('hidden');
      else if (e.data.type === 'SCROLL_UP') topBar.classList.remove('hidden');
      else if (e.data.type === 'PROXY_NAVIGATE') {
        let rt = e.data.url;
        navigate(rt.includes('?url=') ? new URL(rt).searchParams.get('url') : rt);
      }
    });
  </script>
</body>
</html>
