dth .5s}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin-top:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{cursor:pointer;border:1px solid #455778;background:#243450;color:var(--fg);border-radius:11px;padding:12px 15px;font-weight:650}button:hover{background:#354b6c}.primary{background:var(--a);color:#09272b;border:0}.primary:hover{background:#a2f4e8}.foot{text-align:center;color:var(--sub);font-size:12px;margin:25px 0}dialog{background:#17233b;color:var(--fg);border:1px solid #4b6285;border-radius:18px;padding:24px;width:min(94vw,450px)}dialog::backdrop{background:#000b}input{padding:12px;border:1px solid #4b6285;background:#243450;color:white;border-radius:10px;max-width:100%}.formrow{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:560px){.panel{padding:16px}.grid{gap:7px}.unit{padding:13px 4px}.num{letter-spacing:-1px}.lbl{font-size:11px}}

:root{--bg:#080514;--fg:#f3eaff;--sub:#a79bbd;--a:#d6a7ff;--b:#77e6db}body{background:radial-gradient(ellipse at 50% -20%,#392056 0,transparent 55%),radial-gradient(ellipse at 100% 95%,#112c3a 0,transparent 50%),#080514;position:relative}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#fff 0.7px,transparent 1px);background-size:37px 43px;mask-image:linear-gradient(#0007,transparent 85%)}.wrap{max-width:960px;padding:20px 14px 30px;position:relative}.eyebrow{font-size:10px;letter-spacing:2.5px;text-align:center;color:#bca1e6}h1{font-size:clamp(19px,3vw,27px);letter-spacing:-.6px;text-align:center;margin:5px 0 8px;font-weight:600}h1 span{color:#dfb9ff}.pill{display:flex;width:max-content;margin:auto;padding:4px 9px;font-size:9px;border-color:#67507b}.dot{width:5px;height:5px}#now{text-align:center;font-size:11px;margin:7px 0 12px}.panel{margin-top:12px;padding:17px;background:linear-gradient(140deg,#1c1431eb,#0d1529ed);border:1px solid #61447b77;border-radius:18px;box-shadow:0 9px 35px #0004,inset 0 1px #ffffff0b}.panel.elapsed{border-color:#7c558b88}.top{margin-bottom:12px}.top strong{font-size:12px;font-weight:650;letter-spacing:.4px}.clock,.note{font-size:10px}.grid{gap:8px}.unit{background:linear-gradient(160deg,#322044,#171d35);border-color:#7e61914d;border-radius:12px;padding:13px 5px;box-shadow:inset 0 1px #ffffff0b}.num{font-size:clamp(28px,5vw,47px);letter-spacing:-1px;text-shadow:0 0 18px #b989e833}.elapsed .num{color:#dfb8ff}.lbl{font-size:11px}.subgrid{gap:8px;margin-top:8px}.subgrid .unit{padding:9px 4px}.subgrid .num{font-size:clamp(22px,3vw,30px)}.sectionlabel{font-size:10px;margin:10px 0 6px}.stats{font-size:10px;margin-top:9px}.track{height:6px;background:#30233f;margin-top:8px}.bar{background:linear-gradient(90deg,#9b67e9,#e0adff,#79e4d9);box-shadow:0 0 15px #c792ef88}.controls{margin-top:12px;gap:7px}button{font-size:11px;padding:8px 11px;border-radius:9px;background:#2a203e;border-color:#715a85}button:hover{background:#46305e}.primary{background:#b78de3;color:#160d23}.primary:hover{background:#d3b0f4}.foot{font-size:10px;margin:13px 0;opacity:.65}dialog{background:#19132a;border-color:#745a8e}dialog h2{font-size:17px}dialog p{font-size:12px}@media(max-width:560px){.wrap{padding:13px 9px 22px}.panel{padding:12px;margin-top:10px}.top strong{font-size:10px}.top .clock{font-size:9px}.grid{gap:5px}.unit{padding:11px 2px}.num{font-size:clamp(23px,7vw,36px)}.subgrid .num{font-size:23px}.stats{font-size:9px}.controls button{flex:1 1 auto}}
 .summary-line{display:block;text-align:center;line-height:1.5;font-size:clamp(10px,2.5vw,13px);white-space:normal}.progress-panel{margin-top:0;padding:15px 17px}.progress-panel .top{margin-bottom:8px}.progress-panel .stats{margin-top:12px}.wrap{padding-top:14px}#now{margin:0 0 10px;color:#a99bbf;font-size:11px} </style></head><body><main class="wrap"><section class="panel progress-panel"><div class="top"><strong>Toplam sürede ilerleme</strong><span id="percent" class="clock"></span></div><div class="track"><div id="bar" class="bar"></div></div><div class="stats summary-line" id="timeSummary"></div></section><p id="now"></p>
<section class="panel elapsed"><div class="top"><strong>29 TEMMUZ 2025'TEN BERİ GEÇEN SÜRE</strong><span class="clock">Başlangıç 00:00</span></div><div class="grid" id="elapsedGrid"></div><div class="sectionlabel">Ayrıca geçen zaman</div><div class="subgrid" id="elapsedExtra"></div></section>
<section class="panel"><div class="top"><strong id="targetLabel">28 TEMMUZ 2029'A KALAN SÜRE</strong><span class="clock">Hedef 00:00</span></div><div class="grid" id="remainingGrid"></div><div class="sectionlabel">Ayrıca kalan zaman</div><div class="subgrid" id="remainingExtra"></div></section></main>

<script>
const $=id=>document.getElementById(id), START=Date.parse('2025-07-29T00:00:00+03:00'), DEFAULT=Date.parse('2029-07-28T00:00:00+03:00');let target=DEFAULT;
const fmt=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const nf=n=>n.toLocaleString('tr-TR'),pad=n=>String(n).padStart(2,'0');
// Calendar arithmetic in Turkey fixed UTC+3; handles variable month lengths and leap years.
const shift=3*3600000;
function addMonths(t,n){let d=new Date(t+shift),y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate();let base=new Date(Date.UTC(y,m+n,1,d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds(),d.getUTCMilliseconds()));let last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0)).getUTCDate();base.setUTCDate(Math.min(day,last));return base.getTime()-shift}
function parts(a,b){if(b<=a)return {years:0,months:0,weeks:0,days:0,hours:0,minutes:0,seconds:0,totalDays:0,totalWeeks:0};let months=0,lo=0,hi=Math.max(1,Math.ceil((b-a)/2419200000)+1);while(lo<hi){let mid=Math.ceil((lo+hi)/2);if(addMonths(a,mid)<=b)lo=mid;else hi=mid-1}months=lo;let rest=Math.floor((b-addMonths(a,months))/1000),days=Math.floor(rest/86400);rest%=86400;return {years:Math.floor(months/12),months:months%12,weeks:Math.floor(days/7),days:days%7,hours:Math.floor(rest/3600),minutes:Math.floor(rest%3600/60),seconds:rest%60,totalDays:Math.floor((b-a)/86400000),totalWeeks:Math.floor((b-a)/604800000)}}
function make(id,keys){$(id).innerHTML=keys.map(([key,label])=>`<div class="unit"><div class="num" data-key="${key}">—</div><div class="lbl">${label}</div></div>`).join('')}
for(const prefix of ['elapsed','remaining']){make(prefix+'Grid',[['years','Yıl'],['months','Ay'],['weeks','Hafta'],['days','Gün']]);make(prefix+'Extra',[['hours','Saat'],['minutes','Dakika'],['seconds','Saniye']])}
function put(prefix,p){document.querySelectorAll('#'+prefix+'Grid [data-key],#'+prefix+'Extra [data-key]').forEach(el=>el.textContent=['hours','minutes','seconds'].includes(el.dataset.key)?pad(p[el.dataset.key]):nf(p[el.dataset.key]))}
function render(){const now=Date.now(),e=parts(START,now),r=parts(now,target);put('elapsed',e);put('remaining',r);$('now').textContent=fmt.format(now);$('targetLabel').textContent=fmt.format(target).toLocaleUpperCase('tr-TR')+' TARİHİNE KALAN SÜRE';$('timeSummary').textContent=nf(e.totalDays)+' gün ('+nf(e.totalWeeks)+' hafta, '+nf(e.years*12+e.months)+' ay) geçti; '+nf(r.totalDays)+' gün ('+nf(r.totalWeeks)+' hafta, '+nf(r.years*12+r.months)+' ay) kaldı.';let duration=target-START,pct=duration>0?Math.max(0,Math.min(100,(now-START)/duration*100)):now>=target?100:0;$('bar').style.width=pct+'%';$('percent').textContent='%'+pct.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})}
render();setInterval(render,1000);</script></body></html>
