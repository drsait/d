<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liste</title>
<style>*{box-sizing:border-box}:root{color-scheme:light;--primary:#0f766e;--bg:#f4f6f8;--surface:#fff;--text:#253249;--border:#e5e9ef}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px 24px;font-size:14px;line-height:1.5}.container{max-width:1240px;margin:auto}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #182b4504}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-top:16px}.control-group{display:flex;flex-direction:column;gap:6px}.toggle-group{display:inline-flex;align-items:center;gap:8px;margin:0 20px 8px 0}.toggle-group label{cursor:pointer;color:#475569!important}label{font-size:12px;font-weight:550;color:#64748b}input,select,button{font:inherit;border-radius:9px}input,select{padding:9px 11px;border:1px solid #dfe5ec;background:#fff;color:#253249;min-width:0}input[type=checkbox]{accent-color:#0f766e}button{padding:10px 16px;border:1px solid transparent;background:#0f766e;color:white;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s}button:hover{background:#115e59}button:disabled{opacity:.45;cursor:wait}input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #99f6e4;outline-offset:2px}.log-box{display:none;padding:10px 14px;margin-bottom:14px;border-radius:10px;font-size:12px}.log-info{background:#edf7f5;color:#47706b}.log-warning{background:#fff4df;color:#92400e}#uploadStatus{color:#64748b;font-size:12px;overflow-wrap:anywhere}#uploadStatus:not(:empty){margin-top:10px}#planned30Info{font-size:12px;color:#94a3b8;margin:0}#resultCard>button{background:#fff;color:#475569;border-color:#dfe5ec;margin-right:6px;padding:8px 13px}#resultCard>button:hover{background:#f1f5f9}#copyNotice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#166534;color:#fff;padding:12px 20px;border-radius:10px;z-index:1000}@media(max-width:640px){body{padding:14px 10px}.card{padding:14px;border-radius:12px}.controls{grid-template-columns:1fr 1fr}.toggle-group{display:flex;margin-right:0}}</style>
</head>
<body>
<div class="container">

<div class="card">
<button type="button" disabled onclick="document.getElementById('combinedFiles').click()">Dosyaları Yükle</button>
<input id="combinedFiles" type="file" accept=".txt,.csv,.json,.tsv,.xlsx,.xls" multiple hidden onchange="uploadFiles(this)">

<form id="linkForm" onsubmit="event.preventDefault();loadFromLink()" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
<input id="sourceUrl" type="url" value="https://varsayilan.com" placeholder="https://…" aria-label="Liste bağlantısı" required style="flex:1;min-width:200px" autocomplete="off">
<select id="sourceRole" aria-label="Bağlantıdaki liste türü"><option value="jsonInput">Ana veri</option><option value="secondListInput">Karşılaştırma</option></select>
<button id="loadLinkButton" type="submit" disabled>Bağlantıdan Al</button>
</form>
<div id="uploadStatus" role="status" style="font-size:.85rem"></div>
<input type="hidden" id="jsonInput"><input type="hidden" id="secondListInput">
</div>
<div id="statusLog" class="log-box"></div>
<div class="card" id="filterCard" style="display:none;">

<div class="toggle-group">
<input type="checkbox" id="strictMatchToggle" checked onchange="applyFilters()" style="width: 18px; height: 18px; cursor: pointer;">
<label for="strictMatchToggle" style="cursor: pointer; color: #1e40af; margin:0;">
Yalnızca eşleşen kişiler
</label>
</div>
<div class="toggle-group">
<input type="checkbox" id="planned30Toggle" checked onchange="applyFilters()" style="width:18px;height:18px">
<label for="planned30Toggle">Gecikenler ve önümüzdeki 30 gün</label>
</div>
<p id="planned30Info" style="font-size:0.85rem;color:#475569"></p>
<div class="controls">
<div class="control-group">
<label>Kişi</label>
<input autocomplete="off" type="text" id="searchInput" placeholder="Ad, soyad veya TC" oninput="applyFilters()">
</div>
<div class="control-group">
<label>Başlangıç</label>
<input type="date" id="startDate" onchange="applyFilters()">
</div>
<div class="control-group">
<label>Bitiş</label>
<input type="date" id="endDate" onchange="applyFilters()">
</div>
<div class="control-group">
<label>Hastalık</label>
<select id="careTypeFilter" onchange="applyFilters()">
<option value="">Tümü</option>
</select>
</div>
<div class="control-group">
<label>Durum</label>
<select id="statusFilter" onchange="applyFilters()">
<option value="">Tümü</option>
<option value="late">Gecikmiş</option>
<option value="in-list">Listede</option>
<option value="upcoming">Yaklaşan</option>
<option value="waitlist">Durdurulmuş</option>
</select>
</div>
</div>
</div>
<div class="card" id="resultCard" style="display:none;">
<button onclick="copyResults()">Kopyala</button> <button onclick="exportResultsHTML()">HTML Kaydet</button>
<div id="resultsHost"></div>
</div>
</div>
<div id="copyNotice" role="status" aria-live="polite" hidden></div>
