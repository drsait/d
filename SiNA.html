<!DOCTYPE html>

<!--
=======================================================================
                 ★★★ SADECE BURAYI DEĞİŞTİR ★★★
=======================================================================

BİRİM KODU : 461491
YIL        : 2026
AY         : 10

AY NUMARALARI:
1=OCAK | 2=ŞUBAT | 3=MART | 4=NİSAN | 5=MAYIS | 6=HAZİRAN
7=TEMMUZ | 8=AĞUSTOS | 9=EYLÜL | 10=EKİM | 11=KASIM | 12=ARALIK

Gerçek ayarlar hemen aşağıdaki script bölümündedir.
=======================================================================
-->

<script>
const AYARLAR = {
    BIRIM_KODU: "461491", // SİNA birim kodu
    YIL: 2026,            // Kullanılacak yıl
    AY: 9                 // 1=Ocak ... 9=Eylül ... 12=Aralık
};
</script>


<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SİNA Bağlantı Yönlendirici</title>


    <style>

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;

            background: #f4f6f9;
            color: #333;
        }


        .container {
            background: white;

            padding: 2rem;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,.1);

            max-width: 480px;
            width: 90%;

            text-align: center;
        }


        h1 {
            font-size: 1.5rem;

            margin-bottom: 1.5rem;

            color: #1a365d;
        }


        .link-list {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }


        .link-btn {
            display: block;

            padding: 12px 16px;

            background: #0066cc;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: 500;

            transition:
                background-color .2s;
        }


        .link-btn:hover {
            background: #004b99;
        }


        .status {
            font-size: 1.1rem;

            color: #2b6cb0;
        }

    </style>

</head>


<body>


<div class="container">

    <div id="content">

        <h1>
            SİNA Hızlı Erişim
        </h1>

        <p>
            Lütfen erişmek istediğiniz modülü seçin:
        </p>

        <div
            id="button-container"
            class="link-list">
        </div>

    </div>

</div>



<script>


// =====================================================================
// BURADAN SONRASINA DOKUNMANA GEREK YOK
// =====================================================================



// =====================================================================
// AY BİLGİLERİ
// =====================================================================


// Ayı iki haneli yapar.
//
// 9  → 09
// 10 → 10

const AY_NUM =
    String(AYARLAR.AY)
        .padStart(2, "0");



// Yıl + ay
//
// Örnek:
//
// 2026 + 9
//
// → 2026-09

const AY_TARIH =
    `${AYARLAR.YIL}-${AY_NUM}`;





// =====================================================================
// AY İSİMLERİ
// =====================================================================

const AY_ISIMLERI = [

    "",

    "OCAK",
    "ŞUBAT",
    "MART",
    "NİSAN",
    "MAYIS",
    "HAZİRAN",
    "TEMMUZ",
    "AĞUSTOS",
    "EYLÜL",
    "EKİM",
    "KASIM",
    "ARALIK"

];



const AY_ISMI =
    AY_ISIMLERI[
        AYARLAR.AY
    ];



// SİNA ay adı
//
// Türkçe karakterler DEĞİŞMEZ.
//
// EYLÜL → EYLÜL
// AĞUSTOS → AĞUSTOS

const AY_SINA =
    AY_ISMI;



// KHT ay adı

const AY_KHT =
    AY_ISMI;





// =====================================================================
// SİNA LİNKLERİ
// =====================================================================


const LINK_SABLONLARI = {



    // ================================================================
    // SİNA
    //
    // Ay:
    // EYLÜL
    //
    // ================================================================

    SINA:

    "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-2N8Y5C2ADDC1FCD?filters=252840={AY_SINA}%26252860={BIRIM_KODU}%26252916={YIL}",




    // ================================================================
    // KHT
    //
    // Ay:
    // EYLÜL
    //
    // ================================================================

    KHT:

    "https://sina.saglik.gov.tr/showcases/SC-2DF3A82DF98O48J/SCI-VCQ97DDE181J1HA?filters=300699={YIL}%26300707={AY_KHT}%26300711={BIRIM_KODU}",




    // ================================================================
    // MEMNUNİYET
    //
    // Seçilen yılın tamamı
    // ================================================================

    MEMNUNIYET:

    "https://sina.saglik.gov.tr/showcases/SC-AA6Q1F9AU1B4B2O/SCI-E52DD7UAC0Y24Z5?filters=27693={YIL}-01-01%252000%253A00%253A00%2627693={YIL}-12-31%252023%253A59%253A59",




    // ================================================================
    // MUAYENE
    //
    // Yıl
    // Ay (09)
    // Birim
    //
    // ================================================================

    MUAYENE:

    "https://sina.saglik.gov.tr/showcases/SC-2DF3A82DF98O48J/SCI-I6CADQFQ66C142A?filters=301711={YIL}%26301715={AY_NUM}%26dbmfl-ffaiq1022rfdy5e={BIRIM_KODU}",




    // ================================================================
    // OTİZM
    //
    // Ay:
    //
    // 2026-09
    //
    // ================================================================

    OTIZM:

    "https://sina.saglik.gov.tr/showcases/SC-DBBEMXEEDFCCEAB/SCI-4N2O921XV9IX02M?filters=372133={BIRIM_KODU}%26372137={AY_TARIH}%26372145={AY_TARIH}%26dbmfl-0eebb5447f112m8={AY_TARIH}"


};





// =====================================================================
// DEĞİŞKENLER
// =====================================================================


const DEGISKENLER = {

    BIRIM_KODU:
        AYARLAR.BIRIM_KODU,

    YIL:
        AYARLAR.YIL,

    AY_NUM:
        AY_NUM,

    AY_SINA:
        AY_SINA,

    AY_KHT:
        AY_KHT,

    AY_TARIH:
        AY_TARIH

};





// =====================================================================
// LİNK OLUŞTURMA FONKSİYONU
// =====================================================================


function linkOlustur(sablon) {

    let url =
        sablon;


    for (
        const [key, val]
        of Object.entries(
            DEGISKENLER
        )
    ) {

        url =
            url.replaceAll(
                `{${key}}`,
                val
            );

    }


    return url;

}





// =====================================================================
// GERÇEK LİNKLERİ OLUŞTUR
// =====================================================================


const FINAL_LINKS = {};


for (
    const key
    in LINK_SABLONLARI
) {

    FINAL_LINKS[key] =
        linkOlustur(
            LINK_SABLONLARI[key]
        );

}





// =====================================================================
// HTML DOSYASININ ADRESİ
// =====================================================================


const SAYFA_ADRESI =

    window.location.origin +

    window.location.pathname;





// =====================================================================
// BUTONLARI OLUŞTUR
// =====================================================================


const container =

    document.getElementById(
        "button-container"
    );



for (
    const key
    in FINAL_LINKS
) {


    const btn =
        document.createElement(
            "a"
        );



    btn.className =
        "link-btn";



    // ---------------------------------------------------------------
    // Örnek:
    //
    // index.html?url=SINA
    // index.html?url=KHT
    // index.html?url=MUAYENE
    // ---------------------------------------------------------------


    btn.href =

        SAYFA_ADRESI +

        "?url=" +

        encodeURIComponent(
            key
        );



    // Yeni sekmede aç

    btn.target =
        "_blank";


    btn.rel =
        "noopener noreferrer";



    btn.innerText =
        key;



    container.appendChild(
        btn
    );

}





// =====================================================================
// URL PARAMETRESİNİ OKU
// =====================================================================


const urlParams =

    new URLSearchParams(
        window.location.search
    );



const targetKey =

    urlParams.get(
        "url"
    );





// =====================================================================
// GERÇEK SİNA ADRESİNE YÖNLENDİR
// =====================================================================


if (targetKey) {


    const key =

        targetKey
            .toUpperCase();



    const targetUrl =

        FINAL_LINKS[key];



    if (targetUrl) {


        window.location.replace(
            targetUrl
        );


    }


    else {


        document
            .getElementById(
                "content"
            )
            .innerHTML = `


            <p class="status">

                <strong>
                    ${key}
                </strong>

                adlı bağlantı bulunamadı.

            </p>


            <p>

                <a href="${SAYFA_ADRESI}">
                    Ana sayfaya dön
                </a>

            </p>


        `;


    }

}


</script>


</body>
</html>
